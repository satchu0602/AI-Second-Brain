name: AI News Collector

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Fetch AI news
        run: |
          mkdir -p research
          DATE=$(date +"%Y-%m-%d")

          echo "# AI News $DATE" > research/ai-news-$DATE.md
          echo "" >> research/ai-news-$DATE.md
          echo "## Sources" >> research/ai-news-$DATE.md
          echo "- https://news.ycombinator.com" >> research/ai-news-$DATE.md
          echo "- https://arxiv.org" >> research/ai-news-$DATE.md
          echo "- https://openai.com/blog" >> research/ai-news-$DATE.md

      - name: Commit file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "AI news update" || echo "No changes"
          git push